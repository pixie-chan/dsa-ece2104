<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 660" width="840" height="660" font-family="IBM Plex Mono, ui-monospace, monospace" role="img" aria-label="Dependency chain of the sixteen mid-term lectures: ten in CO1, six in CO2, and where each artifact already exists">
  <rect width="840" height="660" fill="#ffffff"/>

  <text x="16" y="26" font-size="13" font-weight="600" fill="#1c1917">CO1 · lectures 1 to 10</text>
  <text x="440" y="26" font-size="13" font-weight="600" fill="#1c1917">CO2 · lectures 11 to 16</text>

  <!-- CO1 column -->
  <line x1="42" y1="52" x2="42" y2="620" stroke="#c9c4ba" stroke-width="2"/>
  <g font-size="11">
    <circle cx="42" cy="70" r="6" fill="#3d6b3f"/><text x="60" y="74" fill="#1c1917">1 briefing</text>
    <circle cx="42" cy="122" r="6" fill="#3d6b3f"/><text x="60" y="126" fill="#1c1917">2 C++ / Python structure</text>
    <circle cx="42" cy="174" r="6" fill="#3d6b3f"/><text x="60" y="178" fill="#1c1917">3 variables, types, operators, IO</text>
    <circle cx="42" cy="226" r="6" fill="#3d6b3f"/><text x="60" y="230" fill="#1c1917">4 control statements, functions</text>
    <circle cx="42" cy="286" r="7" fill="#3d6b3f"/><text x="60" y="290" font-weight="600" fill="#1c1917">5 memory representation</text>
    <text x="60" y="306" fill="#6b655c">guide, notes, verifier, capture</text>
    <circle cx="42" cy="346" r="7" fill="#3d6b3f"/><text x="60" y="350" font-weight="600" fill="#1c1917">6 linked list: node in memory</text>
    <text x="60" y="366" fill="#6b655c">notes, 2 diagrams, lesson 06</text>
    <circle cx="42" cy="406" r="7" fill="#3d6b3f"/><text x="60" y="410" font-weight="600" fill="#1c1917">7 list operations</text>
    <text x="60" y="426" fill="#6b655c">lesson 07, 2 diagrams</text>
    <circle cx="42" cy="466" r="7" fill="#3d6b3f"/><text x="60" y="470" font-weight="600" fill="#1c1917">8 searching, numericals</text>
    <text x="60" y="490" fill="#6b655c">lesson 08, 12 solved numericals</text>
    <circle cx="42" cy="530" r="6" fill="#8a6a1f"/><text x="60" y="534" fill="#1c1917">9 tutorial</text>
    <circle cx="42" cy="576" r="6" fill="#8a6a1f"/><text x="60" y="580" fill="#1c1917">10 class test 1</text>
  </g>

  <!-- CO2 column -->
  <line x1="466" y1="52" x2="466" y2="620" stroke="#c9c4ba" stroke-width="2"/>
  <g font-size="11">
    <circle cx="466" cy="70" r="6" fill="#8a6a1f"/><text x="484" y="74" fill="#1c1917">11 stack, array representation</text>
    <text x="484" y="90" fill="#6b655c">stack-guide.html only</text>
    <circle cx="466" cy="130" r="6" fill="#7a3355"/><text x="484" y="134" fill="#1c1917">12 stack linked, applications</text>
    <text x="484" y="150" fill="#7a3355">gap</text>
    <circle cx="466" cy="190" r="6" fill="#7a3355"/><text x="484" y="194" fill="#1c1917">13 queue, array representation</text>
    <text x="484" y="210" fill="#7a3355">gap</text>
    <circle cx="466" cy="250" r="6" fill="#7a3355"/><text x="484" y="254" fill="#1c1917">14 queue linked, circular</text>
    <text x="484" y="270" fill="#7a3355">gap</text>
    <circle cx="466" cy="310" r="6" fill="#7a3355"/><text x="484" y="314" fill="#1c1917">15 queue applications</text>
    <text x="484" y="330" fill="#7a3355">gap</text>
    <circle cx="466" cy="390" r="7" fill="#8a6a1f"/><text x="484" y="394" font-weight="600" fill="#1c1917">16 recursion, recursive algorithms</text>
    <text x="484" y="414" fill="#6b655c">09_recursion_frames.cpp, measured</text>
    <text x="484" y="430" fill="#6b655c">frames, calls and nesting</text>
  </g>

  <!-- the bridge -->
  <path d="M42 576 L42 620 L466 620 L466 390" fill="none" stroke="#8a8375" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="150" y="612" font-size="11" fill="#6b655c">the call stack in lecture 16 is the same stack from lecture 11, read from the other side</text>

  <g font-size="10" fill="#4a453f">
    <circle cx="60" cy="648" r="5" fill="#3d6b3f"/><text x="72" y="652">artifact shipped and verified</text>
    <circle cx="266" cy="648" r="5" fill="#8a6a1f"/><text x="278" y="652">partial</text>
    <circle cx="372" cy="648" r="5" fill="#7a3355"/><text x="384" y="652">gap, nothing built yet</text>
  </g>
</svg>
