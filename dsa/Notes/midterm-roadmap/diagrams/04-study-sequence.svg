<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" font-family="IBM Plex Mono, ui-monospace, monospace" role="img" aria-label="Seven study sessions: what each one covers, what it produces, and where the checkpoints sit">
  <rect width="840" height="470" fill="#ffffff"/>

  <!-- session rungs, two columns -->
  <g font-size="11">
    <!-- left column, sessions 1 to 4 -->
    <g>
      <rect x="12" y="24" width="400" height="84" rx="4" fill="#f7f4ef" stroke="#1b4d7a" stroke-width="1.5"/>
      <circle cx="40" cy="52" r="14" fill="#ffffff" stroke="#1b4d7a" stroke-width="1.5"/>
      <text x="35" y="56" font-size="12" font-weight="600" fill="#1c1917">1</text>
      <text x="66" y="48" font-size="12" font-weight="600" fill="#1c1917">Memory representation</text>
      <text x="66" y="66" fill="#4a453f">lectures 5, 6, 7, 8: the address lane guide,</text>
      <text x="66" y="82" fill="#4a453f">linked list notes, then 12 numericals</text>
      <text x="66" y="99" fill="#6b655c">proof: run verify_ds_memory_lec5.py</text>
    </g>
    <g>
      <rect x="12" y="120" width="400" height="84" rx="4" fill="#f7f4ef" stroke="#1b4d7a" stroke-width="1.5"/>
      <circle cx="40" cy="148" r="14" fill="#ffffff" stroke="#1b4d7a" stroke-width="1.5"/>
      <text x="35" y="152" font-size="12" font-weight="600" fill="#1c1917">2</text>
      <text x="66" y="144" font-size="12" font-weight="600" fill="#1c1917">Linked list, by hand</text>
      <text x="66" y="162" fill="#4a453f">draw node, insert, delete and traverse on</text>
      <text x="66" y="178" fill="#4a453f">paper first, then type lesson 07</text>
      <text x="66" y="195" fill="#6b655c">proof: the four diagrams, reproduced from memory</text>
    </g>
    <g>
      <rect x="12" y="216" width="400" height="84" rx="4" fill="#f7f4ef" stroke="#1b4d7a" stroke-width="1.5"/>
      <circle cx="40" cy="244" r="14" fill="#ffffff" stroke="#1b4d7a" stroke-width="1.5"/>
      <text x="35" y="248" font-size="12" font-weight="600" fill="#1c1917">3</text>
      <text x="66" y="240" font-size="12" font-weight="600" fill="#1c1917">Stacks</text>
      <text x="66" y="258" fill="#4a453f">array and linked representation, overflow,</text>
      <text x="66" y="274" fill="#4a453f">bracket matching, reverse a string</text>
      <text x="66" y="291" fill="#6b655c">proof: push until it refuses, print why</text>
    </g>
    <g>
      <rect x="12" y="312" width="400" height="84" rx="4" fill="#f7f4ef" stroke="#1b4d7a" stroke-width="1.5"/>
      <circle cx="40" cy="340" r="14" fill="#ffffff" stroke="#1b4d7a" stroke-width="1.5"/>
      <text x="35" y="344" font-size="12" font-weight="600" fill="#1c1917">4</text>
      <text x="66" y="336" font-size="12" font-weight="600" fill="#1c1917">Queues and the circular trick</text>
      <text x="66" y="354" fill="#4a453f">array, linked, circular wrap around, and the</text>
      <text x="66" y="370" fill="#4a453f">full against empty ambiguity</text>
      <text x="66" y="387" fill="#6b655c">proof: two full wrap arounds, count the elements</text>
    </g>

    <!-- right column, sessions 5 to 7 -->
    <g>
      <rect x="428" y="24" width="400" height="84" rx="4" fill="#f7f4ef" stroke="#1b4d7a" stroke-width="1.5"/>
      <circle cx="456" cy="52" r="14" fill="#ffffff" stroke="#1b4d7a" stroke-width="1.5"/>
      <text x="451" y="56" font-size="12" font-weight="600" fill="#1c1917">5</text>
      <text x="482" y="48" font-size="12" font-weight="600" fill="#1c1917">Recursion, traced in frames</text>
      <text x="482" y="66" fill="#4a453f">factorial, fibonacci, Hanoi: run</text>
      <text x="482" y="82" fill="#4a453f">09_recursion_frames.cpp and read the frames</text>
      <text x="482" y="99" fill="#6b655c">proof: 7 calls, 7 moves, nesting 3</text>
    </g>
    <g>
      <rect x="428" y="120" width="400" height="84" rx="4" fill="#f7f1e6" stroke="#8a6a1f" stroke-width="1.5" stroke-dasharray="5 3"/>
      <circle cx="456" cy="148" r="14" fill="#ffffff" stroke="#8a6a1f" stroke-width="1.5"/>
      <text x="451" y="152" font-size="12" font-weight="600" fill="#1c1917">6</text>
      <text x="482" y="144" font-size="12" font-weight="600" fill="#1c1917">Numericals under time</text>
      <text x="482" y="162" fill="#4a453f">the twelve problems with the clock on,</text>
      <text x="482" y="178" fill="#4a453f">answers hidden, then checked against the key</text>
      <text x="482" y="195" fill="#6b655c">checkpoint: CWS style quiz, CO1 and CO2</text>
    </g>
    <g>
      <rect x="428" y="216" width="400" height="84" rx="4" fill="#f3e7ee" stroke="#7a3355" stroke-width="1.5"/>
      <circle cx="456" cy="244" r="14" fill="#ffffff" stroke="#7a3355" stroke-width="1.5"/>
      <text x="451" y="248" font-size="12" font-weight="600" fill="#4a1f34">7</text>
      <text x="482" y="240" font-size="12" font-weight="600" fill="#4a1f34">Exam simulation</text>
      <text x="482" y="258" fill="#4a453f">write the definitions verbatim, redraw the three</text>
      <text x="482" y="274" fill="#4a453f">memory pictures, no notes, closed book</text>
      <text x="482" y="291" fill="#4a1f34">proof: nothing from the key needed</text>
    </g>

    <!-- checkpoint band -->
    <g>
      <rect x="428" y="316" width="400" height="80" rx="4" fill="#ffffff" stroke="#c9c4ba" stroke-width="1.5" stroke-dasharray="5 3"/>
      <text x="444" y="340" font-size="11" font-weight="600" fill="#1c1917">Two checkpoints already in the timetable</text>
      <text x="444" y="360" fill="#4a453f">lecture 10 class test: everything in CO1</text>
      <text x="444" y="376" fill="#4a453f">lecture 25 class test: heaps and priority queues</text>
      <text x="444" y="392" fill="#6b655c">both count toward the 30 CWS marks</text>
    </g>
  </g>

  <text x="12" y="424" font-size="10" fill="#6b655c">Sessions 1 to 5 run on the shipped artifacts. Sessions 6 and 7 are the exam-facing ones: hand speed over reading speed.</text>
  <text x="12" y="444" font-size="10" fill="#6b655c">Lecture 10 sits inside session 1 as a checkpoint, not as separate material: it only tests what sessions 1 and 2 cover.</text>
</svg>
