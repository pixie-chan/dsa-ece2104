<svg xmlns="http://www.w3.org/2000/svg" width="840" height="660" viewBox="0 0 840 660" role="img" aria-label="Lecture 16 recursion: the fib(4) call tree with 9 calls against a stack only 4 frames deep, measured at fib(32) from 10_recursion_algorithms.cpp">
  <rect width="840" height="660" fill="#ffffff"/>

  <text x="40" y="46" font-family="sans-serif" font-size="22" font-weight="700" fill="#16202c">Lecture 16, Recursion: the call tree is exponential, the stack is not</text>
  <text x="40" y="74" font-family="sans-serif" font-size="15" fill="#5a6b7d">ECE2104 DSA, fib(4): 9 calls in the tree, only 4 frames deep at once</text>

  <text x="30" y="98" font-family="sans-serif" font-size="14" fill="#16202c">the call tree of fib(4)</text>
  <text x="580" y="98" font-family="sans-serif" font-size="14" fill="#16202c">the stack for fib(4)</text>

  <line x1="280" y1="130" x2="170" y2="210" stroke="#c9d4e0" stroke-width="2"/>
  <line x1="280" y1="130" x2="390" y2="210" stroke="#c9d4e0" stroke-width="2"/>
  <line x1="170" y1="210" x2="95" y2="290" stroke="#c9d4e0" stroke-width="2"/>
  <line x1="170" y1="210" x2="200" y2="290" stroke="#c9d4e0" stroke-width="2"/>
  <line x1="390" y1="210" x2="330" y2="290" stroke="#c9d4e0" stroke-width="2"/>
  <line x1="390" y1="210" x2="430" y2="290" stroke="#c9d4e0" stroke-width="2"/>
  <line x1="95" y1="290" x2="65" y2="370" stroke="#c9d4e0" stroke-width="2"/>
  <line x1="95" y1="290" x2="125" y2="370" stroke="#c9d4e0" stroke-width="2"/>

  <circle cx="280" cy="130" r="21" fill="#1f5f8b" stroke="#16202c" stroke-width="2"/>
  <text x="280" y="135" font-family="monospace" font-size="13" fill="#ffffff" text-anchor="middle">f(4)</text>
  <circle cx="170" cy="210" r="21" fill="#eaf2f8" stroke="#1f5f8b" stroke-width="2"/>
  <text x="170" y="215" font-family="monospace" font-size="13" fill="#16202c" text-anchor="middle">f(3)</text>
  <circle cx="390" cy="210" r="21" fill="#fbeee9" stroke="#a8452a" stroke-width="2"/>
  <text x="390" y="215" font-family="monospace" font-size="13" fill="#a8452a" text-anchor="middle">f(2)</text>
  <circle cx="95" cy="290" r="21" fill="#fbeee9" stroke="#a8452a" stroke-width="2"/>
  <text x="95" y="295" font-family="monospace" font-size="13" fill="#a8452a" text-anchor="middle">f(2)</text>
  <circle cx="200" cy="290" r="21" fill="#e9f4ee" stroke="#2f6b4f" stroke-width="2"/>
  <text x="200" y="295" font-family="monospace" font-size="13" fill="#16202c" text-anchor="middle">f(1)</text>
  <circle cx="330" cy="290" r="21" fill="#e9f4ee" stroke="#2f6b4f" stroke-width="2"/>
  <text x="330" y="295" font-family="monospace" font-size="13" fill="#16202c" text-anchor="middle">f(1)</text>
  <circle cx="430" cy="290" r="21" fill="#e9f4ee" stroke="#2f6b4f" stroke-width="2"/>
  <text x="430" y="295" font-family="monospace" font-size="13" fill="#16202c" text-anchor="middle">f(0)</text>
  <circle cx="65" cy="370" r="21" fill="#e9f4ee" stroke="#2f6b4f" stroke-width="2"/>
  <text x="65" y="375" font-family="monospace" font-size="13" fill="#16202c" text-anchor="middle">f(1)</text>
  <circle cx="125" cy="370" r="21" fill="#e9f4ee" stroke="#2f6b4f" stroke-width="2"/>
  <text x="125" y="375" font-family="monospace" font-size="13" fill="#16202c" text-anchor="middle">f(0)</text>

  <text x="30" y="404" font-family="sans-serif" font-size="13" fill="#a8452a">the two red f(2) nodes are the same subproblem, solved twice</text>

  <rect x="580" y="130" width="220" height="32" fill="#eaf2f8" stroke="#1f5f8b" stroke-width="2"/>
  <text x="596" y="151" font-family="monospace" font-size="13" fill="#16202c">frame 1  f(4)</text>
  <rect x="580" y="170" width="220" height="32" fill="#eaf2f8" stroke="#1f5f8b" stroke-width="2"/>
  <text x="596" y="191" font-family="monospace" font-size="13" fill="#16202c">frame 2  f(3)</text>
  <rect x="580" y="210" width="220" height="32" fill="#eaf2f8" stroke="#1f5f8b" stroke-width="2"/>
  <text x="596" y="231" font-family="monospace" font-size="13" fill="#16202c">frame 3  f(2)</text>
  <rect x="580" y="250" width="220" height="32" fill="#e9f4ee" stroke="#2f6b4f" stroke-width="2"/>
  <text x="596" y="271" font-family="monospace" font-size="13" fill="#16202c">frame 4  f(1) base</text>
  <text x="580" y="304" font-family="sans-serif" font-size="13" fill="#5a6b7d">4 frames alive, 9 calls in the tree</text>
  <text x="580" y="326" font-family="sans-serif" font-size="13" fill="#5a6b7d">fib(1) is the base case: it returns</text>
  <text x="580" y="348" font-family="sans-serif" font-size="13" fill="#5a6b7d">without calling fib(0), so the depth is n</text>

  <rect x="30" y="424" width="780" height="170" fill="#eaf2f8" stroke="#c9d4e0"/>
  <text x="46" y="450" font-family="sans-serif" font-size="13" fill="#5a6b7d">WHAT THE SAME SHAPE COSTS AT fib(32), MEASURED IN ONE RUN</text>
  <text x="46" y="478" font-family="monospace" font-size="13" fill="#5a6b7d">quantity</text>
  <text x="470" y="478" font-family="monospace" font-size="13" fill="#5a6b7d">value</text>
  <text x="46" y="502" font-family="monospace" font-size="14" fill="#16202c">naive recursive calls</text>
  <text x="470" y="502" font-family="monospace" font-size="14" fill="#16202c">7049155</text>
  <text x="46" y="526" font-family="monospace" font-size="14" fill="#16202c">memoised recursive calls</text>
  <text x="470" y="526" font-family="monospace" font-size="14" fill="#16202c">63, using a table of 33 entries</text>
  <text x="46" y="550" font-family="monospace" font-size="14" fill="#16202c">times fib(3) is recomputed</text>
  <text x="470" y="550" font-family="monospace" font-size="14" fill="#16202c">832040</text>
  <text x="46" y="574" font-family="monospace" font-size="14" fill="#16202c">deepest stack on that call</text>
  <text x="470" y="574" font-family="monospace" font-size="14" fill="#16202c">32 frames, one per value of n</text>

  <text x="30" y="622" font-family="monospace" font-size="13" fill="#5a6b7d">The tree grows like Fib(n+1) in calls while the stack grows like n, measured not guessed.</text>
  <text x="30" y="644" font-family="monospace" font-size="13" fill="#5a6b7d">Lecture 16 recursion, from 10_recursion_algorithms.cpp section 3, capture lec16_recursion_output</text>
</svg>
