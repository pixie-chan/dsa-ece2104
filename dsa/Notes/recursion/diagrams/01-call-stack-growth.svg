<svg xmlns="http://www.w3.org/2000/svg" width="840" height="680" viewBox="0 0 840 680" role="img" aria-label="Lecture 16 recursion: the call stack growing for factorial(4), four frames of 48 bytes each, measured from 10_recursion_algorithms.cpp">
  <rect width="840" height="680" fill="#ffffff"/>

  <text x="40" y="46" font-family="sans-serif" font-size="22" font-weight="700" fill="#16202c">Lecture 16, Recursion: the call stack growing</text>
  <text x="40" y="74" font-family="sans-serif" font-size="15" fill="#5a6b7d">ECE2104 DSA, factorial(4): four live frames, 48 bytes per frame</text>

  <text x="150" y="104" font-family="monospace" font-size="13" fill="#5a6b7d">high address</text>
  <text x="150" y="424" font-family="monospace" font-size="13" fill="#5a6b7d">low address</text>

  <line x1="120" y1="116" x2="120" y2="396" stroke="#1f5f8b" stroke-width="2"/>
  <path d="M120 412 L113 394 L127 394 Z" fill="#1f5f8b"/>
  <text x="100" y="260" transform="rotate(-90 100 260)" font-family="sans-serif" font-size="14" fill="#5a6b7d" text-anchor="middle">stack grows down</text>

  <rect x="150" y="112" width="340" height="60" fill="#eaf2f8" stroke="#1f5f8b" stroke-width="2"/>
  <text x="166" y="136" font-family="sans-serif" font-size="15" fill="#16202c">factorial(4)   n = 4</text>
  <text x="166" y="158" font-family="monospace" font-size="13" fill="#5a6b7d">return address + frame pointer</text>

  <rect x="150" y="186" width="340" height="60" fill="#eaf2f8" stroke="#1f5f8b" stroke-width="2"/>
  <text x="166" y="210" font-family="sans-serif" font-size="15" fill="#16202c">factorial(3)   n = 3</text>
  <text x="166" y="232" font-family="monospace" font-size="13" fill="#5a6b7d">waiting on 3 x factorial(2)</text>

  <rect x="150" y="260" width="340" height="60" fill="#eaf2f8" stroke="#1f5f8b" stroke-width="2"/>
  <text x="166" y="284" font-family="sans-serif" font-size="15" fill="#16202c">factorial(2)   n = 2</text>
  <text x="166" y="306" font-family="monospace" font-size="13" fill="#5a6b7d">waiting on 2 x factorial(1)</text>

  <rect x="150" y="334" width="340" height="60" fill="#fbeee9" stroke="#a8452a" stroke-width="2"/>
  <text x="166" y="358" font-family="sans-serif" font-size="15" fill="#16202c">factorial(1)   n = 1, deepest frame</text>
  <text x="166" y="380" font-family="monospace" font-size="13" fill="#a8452a">base case: returns 1, no further call</text>

  <line x1="498" y1="112" x2="498" y2="394" stroke="#c9d4e0" stroke-width="2"/>
  <line x1="490" y1="112" x2="506" y2="112" stroke="#c9d4e0" stroke-width="2"/>
  <line x1="490" y1="394" x2="506" y2="394" stroke="#c9d4e0" stroke-width="2"/>

  <text x="520" y="146" font-family="sans-serif" font-size="13" fill="#5a6b7d">depth 1, the first frame</text>
  <text x="520" y="220" font-family="sans-serif" font-size="13" fill="#5a6b7d">depth 2, 48 bytes lower</text>
  <text x="520" y="294" font-family="sans-serif" font-size="13" fill="#5a6b7d">depth 3, 96 bytes lower</text>
  <text x="520" y="368" font-family="sans-serif" font-size="13" fill="#a8452a">depth 4, 144 bytes lower</text>

  <text x="40" y="462" font-family="sans-serif" font-size="14" fill="#16202c">The span from the first call to the innermost is 144 bytes, which is 3 gaps of 48 bytes.</text>
  <text x="40" y="484" font-family="sans-serif" font-size="14" fill="#16202c">Charging every live frame instead gives 4 x 48 = 192, and 240 if main's frame were the same size.</text>

  <rect x="40" y="504" width="760" height="122" fill="#eaf2f8" stroke="#c9d4e0"/>
  <text x="56" y="528" font-family="sans-serif" font-size="13" fill="#5a6b7d">MEASURED FACTS BEHIND THIS PICTURE</text>
  <text x="56" y="552" font-family="monospace" font-size="13" fill="#16202c">factorial(8): 8 calls, 336 byte span across the frames, 48 bytes per call</text>
  <text x="56" y="576" font-family="monospace" font-size="13" fill="#16202c">hanoi(n, from, to, via): 96 bytes per call: four arguments plus the reference parameters</text>
  <text x="56" y="600" font-family="monospace" font-size="13" fill="#16202c">the n = 1 frame is the deepest and is the first to return: exact reverse order</text>

  <text x="40" y="646" font-family="monospace" font-size="13" fill="#5a6b7d">Measured from ~/learning/cpp/lessons/10_recursion_algorithms.cpp, sections 1 and 2,</text>
  <text x="40" y="666" font-family="monospace" font-size="13" fill="#5a6b7d">raw capture ~/learning/cpp/exercises/lec16_recursion_output.txt</text>
</svg>
