<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" font-family="IBM Plex Mono, ui-monospace, monospace" role="img" aria-label="Mid-term timeline: four blocks of teaching, a class test, then the mid-semester exam">
  <rect width="840" height="300" fill="#ffffff"/>

  <g stroke="#c9c4ba" stroke-width="1">
    <line x1="12" y1="46" x2="828" y2="46"/>
  </g>
  <g fill="#6b655c" font-size="11">
    <text x="12" y="36">1 to 4</text>
    <text x="184" y="36">5 to 9</text>
    <text x="397" y="36">10</text>
    <text x="444" y="36">11 to 15</text>
    <text x="657" y="36">16</text>
    <text x="704" y="36">exam</text>
  </g>
  <g stroke="#8a8375" stroke-width="1">
    <line x1="12" y1="46" x2="12" y2="56"/>
    <line x1="184" y1="46" x2="184" y2="56"/>
    <line x1="397" y1="46" x2="397" y2="56"/>
    <line x1="444" y1="46" x2="444" y2="56"/>
    <line x1="657" y1="46" x2="657" y2="56"/>
    <line x1="704" y1="46" x2="704" y2="56"/>
  </g>

  <g>
    <rect x="12" y="60" width="166" height="200" rx="4" fill="#f7f4ef" stroke="#1b4d7a" stroke-width="2"/>
    <text x="24" y="86" font-size="13" font-weight="600" fill="#1c1917">BLOCK A</text>
    <text x="24" y="106" font-size="11" fill="#6b655c">4 lectures</text>
    <line x1="24" y1="118" x2="166" y2="118" stroke="#e2dfd9"/>
    <text x="24" y="140" font-size="12" fill="#1c1917">Foundation</text>
    <text x="24" y="160" font-size="11" fill="#4a453f">C++ and Python</text>
    <text x="24" y="176" font-size="11" fill="#4a453f">syntax, variables,</text>
    <text x="24" y="192" font-size="11" fill="#4a453f">types, operators,</text>
    <text x="24" y="208" font-size="11" fill="#4a453f">control flow,</text>
    <text x="24" y="224" font-size="11" fill="#4a453f">functions</text>
    <text x="24" y="248" font-size="10" fill="#6b655c">lectures 1 to 4</text>
  </g>

  <g>
    <rect x="184" y="60" width="207" height="200" rx="4" fill="#f7f4ef" stroke="#1b4d7a" stroke-width="2"/>
    <text x="196" y="86" font-size="13" font-weight="600" fill="#1c1917">BLOCK B</text>
    <text x="196" y="106" font-size="11" fill="#6b655c">5 lectures</text>
    <line x1="196" y1="118" x2="379" y2="118" stroke="#e2dfd9"/>
    <text x="196" y="140" font-size="12" fill="#1c1917">Memory and lists</text>
    <text x="196" y="160" font-size="11" fill="#4a453f">memory representation,</text>
    <text x="196" y="176" font-size="11" fill="#4a453f">node and pointer,</text>
    <text x="196" y="192" font-size="11" fill="#4a453f">insert, delete, traverse,</text>
    <text x="196" y="208" font-size="11" fill="#4a453f">search, applications,</text>
    <text x="196" y="224" font-size="11" fill="#4a453f">12 numericals</text>
    <text x="196" y="248" font-size="10" fill="#6b655c">lectures 5 to 9</text>
  </g>

  <g>
    <rect x="397" y="60" width="41" height="200" rx="4" fill="#f7f1e6" stroke="#8a6a1f" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="404" y="86" font-size="11" font-weight="600" fill="#3f3115">C</text>
    <text x="404" y="104" font-size="10" fill="#6b655c">test</text>
  </g>

  <g>
    <rect x="444" y="60" width="207" height="200" rx="4" fill="#f7f4ef" stroke="#1b4d7a" stroke-width="2"/>
    <text x="456" y="86" font-size="13" font-weight="600" fill="#1c1917">BLOCK D</text>
    <text x="456" y="106" font-size="11" fill="#6b655c">5 lectures</text>
    <line x1="456" y1="118" x2="639" y2="118" stroke="#e2dfd9"/>
    <text x="456" y="140" font-size="12" fill="#1c1917">Stacks and queues</text>
    <text x="456" y="160" font-size="11" fill="#4a453f">array representation,</text>
    <text x="456" y="176" font-size="11" fill="#4a453f">linked representation,</text>
    <text x="456" y="192" font-size="11" fill="#4a453f">circular wrap around,</text>
    <text x="456" y="208" font-size="11" fill="#4a453f">applications</text>
    <text x="456" y="248" font-size="10" fill="#6b655c">lectures 11 to 15</text>
  </g>

  <g>
    <rect x="657" y="60" width="41" height="200" rx="4" fill="#f7f4ef" stroke="#1b4d7a" stroke-width="2"/>
    <text x="664" y="86" font-size="11" font-weight="600" fill="#1c1917">E</text>
    <text x="664" y="104" font-size="10" fill="#6b655c">rec.</text>
  </g>

  <g>
    <rect x="704" y="60" width="124" height="200" rx="4" fill="#f3e7ee" stroke="#7a3355" stroke-width="2"/>
    <text x="716" y="86" font-size="13" font-weight="600" fill="#4a1f34">EXAM</text>
    <text x="716" y="106" font-size="11" fill="#6b655c">closed book</text>
    <line x1="716" y1="118" x2="816" y2="118" stroke="#e2dfd9"/>
    <text x="716" y="140" font-size="12" fill="#1c1917">Mid-semester</text>
    <text x="716" y="156" font-size="12" fill="#1c1917">examination</text>
    <text x="716" y="184" font-size="14" font-weight="600" fill="#7a3355">30 marks</text>
    <text x="716" y="248" font-size="10" fill="#6b655c">everything above</text>
  </g>

  <text x="12" y="286" font-size="10" fill="#6b655c">Widths are the lecture counts, drawn to scale: 4 : 5 : 1 : 5 : 1, then the exam. Dashed slab = the class test.</text>
</svg>
